name: QA SWAGGA 2.2.8 V6 Club APK (not Play)

on:
  push:
    branches: [qa/swagga-v6-club-android-20261124]
    paths:
      - ".github/workflows/qa-reference-apk.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-qa-debug:
    name: Build reconstructed QA debug APK (analysis ONLY)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line tools
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline-unpack"
          mv "$RUNNER_TEMP/android-cmdline-unpack/cmdline-tools/"* "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Verify 32-count pulse boundaries and seek positions
        run: |
          mkdir -p "$RUNNER_TEMP/beat-grid-test"
          javac -d "$RUNNER_TEMP/beat-grid-test" app/src/main/java/com/alphabeat/daw/ui/BeatGrid32.java qa/BeatGrid32Test.java
          java -cp "$RUNNER_TEMP/beat-grid-test" BeatGrid32Test
      - name: Compile side-by-side QA 2.2.8 debug
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Check separate QA package identity
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.alphabeat.daw.swaggalab.qa224'"
      - name: Record QA APK fingerprint
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'classes[0-9]*.dex|AndroidManifest.xml'
      - name: Upload analysis artifact (not a Play release)
        uses: actions/upload-artifact@v4
        with:
          name: swagga-2.2.8-QA-NEON-8-DEBUG
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
