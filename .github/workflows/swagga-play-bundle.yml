name: SWAGGA LAB PRO 2.3.1 - Play bundle
on:
  push:
    branches: ['release/swagga-2.3.1-playstore']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bootstrap Android command line tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline-unpack"
          mv "$RUNNER_TEMP/android-cmdline-unpack/cmdline-tools/"* "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build release AAB and APK for metadata tests
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace
      - name: Verify package identity, SDK and release debuggable flag
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -n 12
          printf '%s\n' "$BADGING" | grep -F "package: name='com.alphabeat.daw.swaggalab'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='23' versionName='2.3.1'"
          printf '%s\n' "$BADGING" | grep -F "targetSdkVersion:'36'"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -E 'android:debuggable.*0xffffffff'; then
            echo "::error::Release must not be debuggable"; exit 1
          fi
          echo "Release metadata check passed (AAB is UNSIGNED and not ready for Play)"
          sha256sum "$AAB"
          unzip -t "$AAB" | tail -n 1
      - name: Sign with existing Play upload key if configured
        id: signing
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.SWAGGA_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.SWAGGA_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.SWAGGA_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.SWAGGA_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$UPLOAD_KEYSTORE_B64" || -z "$UPLOAD_STORE_PASSWORD" || -z "$UPLOAD_KEY_ALIAS" || -z "$UPLOAD_KEY_PASSWORD" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Original upload key not configured; unsigned build only."
            exit 0
          fi
          umask 077
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 --decode > "$keyfile"
          jarsigner -keystore "$keyfile" -storepass:env UPLOAD_STORE_PASSWORD -keypass:env UPLOAD_KEY_PASSWORD -signedjar "$RUNNER_TEMP/SWAGGA-LAB-PRO-2.3.1.aab" app/build/outputs/bundle/release/app-release.aab "$UPLOAD_KEY_ALIAS"
          jarsigner -verify "$RUNNER_TEMP/SWAGGA-LAB-PRO-2.3.1.aab"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.signed == 'true'
        with:
          name: SWAGGA-2.3.1-SIGNED-PLAY
          path: ${{ runner.temp }}/SWAGGA-LAB-PRO-2.3.1.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.signed == 'false'
        with:
          name: SWAGGA-2.3.1-UNSIGNED-NOT-FOR-PLAY
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
