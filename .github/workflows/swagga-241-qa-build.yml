name: SWAGGA 2.4.1 QA compile
on:
  push:
    branches:
      - fix/swagga-2.4.1-waveform-neon-qa
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile debug APK
        run: bash gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SWAGGA-2.4.1-debug-compile-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
