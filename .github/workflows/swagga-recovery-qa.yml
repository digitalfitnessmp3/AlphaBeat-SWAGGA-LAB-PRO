name: Swagga Recovery QA APK

on:
  push:
    branches:
      - qa/swagga-audio-waveform-recovery-20261126
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/qa/swagga-audio-waveform-recovery-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 36 using runner Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build isolated debug APK
        run: bash gradlew --no-daemon :app:assembleDebug
      - name: Verify package and signature
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.alphabeat.daw.swaggalab.recoveryqa'"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify "$apk"
          mkdir -p recovery-artifact
          cp "$apk" recovery-artifact/Swagga-Lab-Recovery-QA.apk
          (cd recovery-artifact && sha256sum Swagga-Lab-Recovery-QA.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Swagga-Lab-Recovery-QA
          path: recovery-artifact/
          if-no-files-found: error
          retention-days: 14
