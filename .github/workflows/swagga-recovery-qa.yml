name: Swagga Recovery QA APK

on:
  push:
    branches:
      - qa/swagga-audio-waveform-recovery-20261126
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/qa/swagga-audio-waveform-recovery-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Build isolated debug APK
        run: bash gradlew --no-daemon :app:assembleDebug
      - name: Verify package and signature
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.alphabeat.daw.swaggalab.recoveryqa'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          mkdir -p recovery-artifact
          cp "$apk" recovery-artifact/Swagga-Lab-Recovery-QA.apk
          (cd recovery-artifact && sha256sum Swagga-Lab-Recovery-QA.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Swagga-Lab-Recovery-QA
          path: recovery-artifact/
          if-no-files-found: error
          retention-days: 14
