name: SWAGGA 2.2.2 QA unsigned release bundle (NOT for Play)

on:
  push:
    branches: [qa/swagga-2.2.2-play-20261123]
    paths:
      - ".github/workflows/qa-unsigned-aab.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-release:
    name: QA only - unsigned AAB / verify Android package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bootstrap Android command line tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline-unpack"
          mv "$RUNNER_TEMP/android-cmdline-unpack/cmdline-tools/"* "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build unsigned release AAB and APK for metadata tests
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace
      - name: Verify package identity, SDK and release debuggable flag
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -n 12
          printf '%s\n' "$BADGING" | grep -F "package: name='com.alphabeat.daw.swaggalab'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='12' versionName='2.2.2'"
          printf '%s\n' "$BADGING" | grep -F "targetSdkVersion:'36'"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -E 'android:debuggable.*0xffffffff'; then
            echo "::error::Release must not be debuggable"; exit 1
          fi
          echo "Release metadata check passed (AAB is UNSIGNED and not ready for Play)"
          sha256sum "$AAB"
          unzip -t "$AAB" | tail -n 1
      - name: Upload unsigned QA AAB (NEVER publish directly)
        uses: actions/upload-artifact@v4
        with:
          name: SWAGGA-2.2.2-QA-UNSIGNED-NOT-PLAY-READY
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
